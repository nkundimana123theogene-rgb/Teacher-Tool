<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
    
    <!-- Mobile & PWA installability meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Nkorera" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nkorera" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Nkorera Education App</title>
    <meta name="description" content="AI CBC Lesson Plan Generator Platform created by NKUNDIMANA Theogene for primary and secondary teachers. Features CBC/REB lesson plan formats, ECE nursery plan creators, English-standardized assessment builders, high-security printed QR media creators, and progressive web app (PWA) instant installation." />
    <meta property="og:title" content="Nkorera Education App" />
    <meta property="og:description" content="AI CBC Lesson Plan Generator Platform created by NKUNDIMANA Theogene for primary and secondary teachers. Features CBC/REB lesson plan formats, ECE nursery plan creators, English-standardized assessment builders, high-security printed QR media creators, and progressive web app (PWA) instant installation." />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Service Worker successfully registered with scope:', registration.scope);
            })
            .catch((error) => {
              console.log('Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
