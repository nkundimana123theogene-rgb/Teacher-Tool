<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="Nkorera Education - AI Lesson Plan Generator, Nursery Plans, Class Diary & Certificate Creator for Teachers." />
    <meta name="google-site-verification" content="09XPSsLyVtvby0pYCHfe9EKmPYfXAetFgSl6WrSyxDY" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nkorera Edu" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Nkorera Edu" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <title>Nkorera Education - AI Lesson Plan Generator & Certificate Creator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('ServiceWorker registered:', reg.scope);
              
              // Detect new service worker installation
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed') {
                      if (navigator.serviceWorker.controller) {
                        console.log('New app update available!');
                        window.dispatchEvent(new CustomEvent('pwa-update-available', { detail: reg }));
                      }
                    }
                  };
                }
              };

              // Periodically check for app updates every 15 minutes
              setInterval(() => {
                reg.update().catch(() => {});
              }, 15 * 60 * 1000);
            })
            .catch((err) => console.warn('ServiceWorker registration failed:', err));

          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
