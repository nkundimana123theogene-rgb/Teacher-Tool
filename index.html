    <script>
      (function() {
        function canAccessStorageAndServiceWorker() {
          try {
            // Do not register Service Worker if we are running inside an iframe (e.g. AI Studio preview)
            if (window.self !== window.top) {
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                  for (var i = 0; i < registrations.length; i++) {
                    registrations[i].unregister();
                  }
                }).catch(function() {});
              }
              return false;
            }
            if (!('serviceWorker' in navigator)) return false;
            const testKey = '__sw_test__';
            localStorage.setItem(testKey, '1');
            localStorage.removeItem(testKey);
            return true;
          } catch (e) {
            return false;
          }
        }

        if (canAccessStorageAndServiceWorker()) {
          window.addEventListener('load', () => {
            try {
              navigator.serviceWorker.register('/sw.js')
                .then((reg) => {
                  console.log('ServiceWorker registered:', reg.scope);
                  
                  // Detect new service worker installation
                  reg.onupdatefound = () => {
                    const installingWorker = reg.installing;
                    if (installingWorker) {
                      installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed') {
                          if (navigator.serviceWorker.controller) {
                            console.log('New app update available!');
                            window.dispatchEvent(new CustomEvent('pwa-update-available', { detail: reg }));
                          }
                        }
                      };
                    }
                  };

                  // Periodically check for app updates every 15 minutes
                  setInterval(() => {
                    try {
                      reg.update().catch(() => {});
                    } catch (e) {}
                  }, 15 * 60 * 1000);
                })
                .catch((err) => console.warn('ServiceWorker registration failed:', err));

              let refreshing = false;
              navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                  refreshing = true;
                  window.location.reload();
                }
              });
            } catch (err) {
              console.warn('Failed to setup ServiceWorker:', err);
            }
          });
        } else {
          console.log('ServiceWorker registration skipped: Storage access is restricted (e.g., inside a sandboxed iframe).');
        }
      })();
    </script>
