<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="capGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)" />
  <rect width="512" height="512" rx="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="220" r="160" fill="rgba(16, 185, 129, 0.25)" />

  <!-- Main Illustration Group with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Graduation Cap Diamond -->
    <path d="M 256 110 L 410 180 L 256 250 L 102 180 Z" fill="url(#capGradient)" />
    <!-- Cap Underneath Base -->
    <path d="M 166 212 L 166 265 C 166 305 346 305 346 265 L 346 212 C 316 232 286 242 256 242 C 226 242 196 232 166 212 Z" fill="#cbd5e1" />
    <!-- Tassel String and Pendant -->
    <path d="M 256 180 Q 230 200 216 240 L 210 290" stroke="url(#goldGradient)" stroke-width="6" fill="none" stroke-linecap="round" />
    <circle cx="210" cy="295" r="9" fill="url(#goldGradient)" />
    <!-- Tassel Fringe -->
    <path d="M 205 300 L 215 300 L 218 322 L 202 322 Z" fill="url(#goldGradient)" />

    <!-- Open Book Below -->
    <!-- Left Page -->
    <path d="M 130 330 C 180 320 230 335 250 348 L 250 415 C 230 402 180 390 130 400 Z" fill="#f8fafc" />
    <!-- Right Page -->
    <path d="M 382 330 C 332 320 282 335 262 348 L 262 415 C 282 402 332 390 382 400 Z" fill="#e2e8f0" />
    <!-- Book Spine -->
    <path d="M 250 348 L 262 348 L 262 415 L 250 415 Z" fill="#94a3b8" />

    <!-- Page Lines on Left Page -->
    <line x1="150" y1="350" x2="225" y2="346" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="150" y1="365" x2="220" y2="361" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="150" y1="380" x2="210" y2="376" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <!-- Page Lines on Right Page -->
    <line x1="287" y1="346" x2="362" y2="350" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="292" y1="361" x2="362" y2="365" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="302" y1="376" x2="362" y2="380" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <!-- Gold Sparkles / Star -->
    <path d="M 390 120 Q 390 135 405 135 Q 390 135 390 150 Q 390 135 375 135 Q 390 135 390 120 Z" fill="url(#goldGradient)" />
    <path d="M 125 140 Q 125 150 135 150 Q 125 150 125 160 Q 125 150 115 150 Q 125 150 125 140 Z" fill="url(#goldGradient)" />
  </g>

  <!-- App Label Text at bottom -->
  <text x="256" y="460" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#34d399" letter-spacing="4" text-anchor="middle">NKORERA</text>
</svg>
